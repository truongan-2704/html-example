# YOLO26-Prism P2: 4-Head High-Resolution Small Object Detection Model
# ═══════════════════════════════════════════════════════════════════════════

nc: 80 # number of classes
end2end: True # whether to use end-to-end NMS-free mode
reg_max: 1 # DFL bins

scales:
  # [depth_mul, width_mul, max_channels]
  n: [0.50, 0.25, 1024] # Prism26-n-p2
  s: [0.50, 0.50, 1024] # Prism26-s-p2
  m: [0.50, 1.00, 512]  # Prism26-m-p2
  l: [1.00, 1.00, 512]  # Prism26-l-p2
  x: [1.00, 1.50, 512]  # Prism26-x-p2

# YOLO26-Prism P2 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2_Prism, [256, False, 0.25]]      # 2-P2/4   DualFreqConv + MCG (e=0.25)
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2_Prism, [512, False, 0.25]]      # 4-P3/8   DualFreqConv + MCG (e=0.25)
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2_Prism, [512, True]]             # 6-P4/16  DualFreqConv + MCG (c3k=True)
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2_Prism, [1024, True]]            # 8-P5/32  DualFreqConv + MCG (c3k=True)
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 9-P5/32  Enhanced SPPF
  - [-1, 2, C2PSA, [1024]]                       # 10-P5/32 C2PSA Attention Tail

# YOLO26-Prism P2 head (4 output scales: P2, P3, P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11 FPN P5->P4
  - [[-1, 6], 1, Concat, [1]]                     # 12 Concat with backbone P4 (layer 6)
  - [-1, 2, PrismCSP, [512, True]]               # 13 Prism fusion (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14 FPN P4->P3
  - [[-1, 4], 1, Concat, [1]]                     # 15 Concat with backbone P3 (layer 4)
  - [-1, 2, PrismCSP, [256, True]]               # 16 Prism fusion (P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17 FPN P3->P2
  - [[-1, 2], 1, Concat, [1]]                     # 18 Concat with backbone P2 (layer 2)
  - [-1, 2, PrismCSP, [128, True]]               # 19 Prism fusion (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]                    # 20 PAN P2->P3
  - [[-1, 16], 1, Concat, [1]]                    # 21 Concat with FPN P3 (layer 16)
  - [-1, 2, PrismCSP, [256, True]]               # 22 Prism fusion (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 23 PAN P3->P4
  - [[-1, 13], 1, Concat, [1]]                    # 24 Concat with FPN P4 (layer 13)
  - [-1, 2, PrismCSP, [512, True]]               # 25 Prism fusion (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 26 PAN P4->P5
  - [[-1, 10], 1, Concat, [1]]                    # 27 Concat with backbone C2PSA P5 (layer 10)
  - [-1, 1, PrismCSP, [1024, True, 0.5, True]]   # 28 Prism fusion (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]]           # 29 Detect(P2, P3, P4, P5)
