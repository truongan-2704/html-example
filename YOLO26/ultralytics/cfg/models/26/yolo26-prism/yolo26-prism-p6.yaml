# YOLO26-Prism P6: 4-Head Large Receptive Field High-Resolution Detection Model
# ═══════════════════════════════════════════════════════════════════════════

nc: 80 # number of classes
end2end: True # whether to use end-to-end NMS-free mode
reg_max: 1 # DFL bins

scales:
  # [depth_mul, width_mul, max_channels]
  n: [0.50, 0.25, 1024] # Prism26-n-p6
  s: [0.50, 0.50, 1024] # Prism26-s-p6
  m: [0.50, 1.00, 512]  # Prism26-m-p6
  l: [1.00, 1.00, 512]  # Prism26-l-p6
  x: [1.00, 1.50, 512]  # Prism26-x-p6

# YOLO26-Prism P6 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2_Prism, [256, False, 0.25]]      # 2-P2/4   DualFreqConv + MCG (e=0.25)
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2_Prism, [512, False, 0.25]]      # 4-P3/8   DualFreqConv + MCG (e=0.25)
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2_Prism, [512, True]]             # 6-P4/16  DualFreqConv + MCG (c3k=True)
  - [-1, 1, Conv, [768, 3, 2]]                   # 7-P5/32
  - [-1, 2, C3k2_Prism, [768, True]]             # 8-P5/32  DualFreqConv + MCG (c3k=True)
  - [-1, 1, Conv, [1024, 3, 2]]                  # 9-P6/64
  - [-1, 2, C3k2_Prism, [1024, True]]            # 10-P6/64 DualFreqConv + MCG (c3k=True)
  - [-1, 1, SPPF, [1024, 5, 3, True]]            # 11-P6/64 Enhanced SPPF
  - [-1, 2, C2PSA, [1024]]                       # 12-P6/64 C2PSA Attention Tail

# YOLO26-Prism P6 head (4 output scales: P3, P4, P5, P6)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13 FPN P6->P5
  - [[-1, 8], 1, Concat, [1]]                     # 14 Concat with backbone P5 (layer 8)
  - [-1, 2, PrismCSP, [768, True]]               # 15 Prism fusion (P5)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16 FPN P5->P4
  - [[-1, 6], 1, Concat, [1]]                     # 17 Concat with backbone P4 (layer 6)
  - [-1, 2, PrismCSP, [512, True]]               # 18 Prism fusion (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19 FPN P4->P3
  - [[-1, 4], 1, Concat, [1]]                     # 20 Concat with backbone P3 (layer 4)
  - [-1, 2, PrismCSP, [256, True]]               # 21 Prism fusion (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 22 PAN P3->P4
  - [[-1, 18], 1, Concat, [1]]                    # 23 Concat with FPN P4 (layer 18)
  - [-1, 2, PrismCSP, [512, True]]               # 24 Prism fusion (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 25 PAN P4->P5
  - [[-1, 15], 1, Concat, [1]]                    # 26 Concat with FPN P5 (layer 15)
  - [-1, 2, PrismCSP, [768, True]]               # 27 Prism fusion (P5/32-large)

  - [-1, 1, Conv, [768, 3, 2]]                    # 28 PAN P5->P6
  - [[-1, 12], 1, Concat, [1]]                    # 29 Concat with backbone C2PSA P6 (layer 12)
  - [-1, 1, PrismCSP, [1024, True, 0.5, True]]   # 30 Prism fusion (P6/64-xlarge)

  - [[21, 24, 27, 30], 1, Detect, [nc]]           # 31 Detect(P3, P4, P5, P6)
