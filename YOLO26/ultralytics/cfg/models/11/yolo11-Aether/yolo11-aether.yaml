# ═══════════════════════════════════════════════════════════════════════════
# YOLO-Aether: Omni-Spectral Manifold Convolution & Harmonic Resonant Neck
# ═══════════════════════════════════════════════════════════════════════════
#
# A revolutionary next-generation architecture replacing both PANet and BiFPN:
#
#   1. Backbone: C3k2_Aether (Powered by OSM-Conv)
#      → Omni-Spectral Manifold Convolution decomposes channels into:
#        - 25% Detail Path: Micro-kernel (3x3) capturing high-frequency boundaries
#        - 25% Context Path: Grouped Dilated Conv (3x3, d=2) for broad semantic context
#        - 50% Direct Highway: Identity/Projection path with high arithmetic intensity
#      → Modulated by Energy Router Gate for adaptive spatial-channel recalibration
#
#   2. Neck: Harmonic Resonant Pyramid (HRP-Neck)
#      → Central Resonant Broadcast Node (AetherResonantCore):
#        Aggregates P3, P4, P5 simultaneously in a single-step resonant manifold.
#      → Content-Spatial Adaptive Fusion (AetherCSAF):
#        Replaces PANet Concat and BiFPN scalar weights with 2D dynamic spatial
#        weight matrices [B, 2, H, W] per pixel with zero channel phình.
#      → AetherCSP: Refinement blocks powered by OSM-Conv.
#
#   3. Head: Decoupled Detect (P3, P4, P5)
#
# Hardware efficiency:
#   - Arithmetic Intensity significantly higher than DWConv / BiFPN
#   - Zero memory bandwidth explosion (no multi-layer channel doubling)
#   - 100% compatible with ONNX, TensorRT, TorchScript

nc: 80
scales:
  # [depth_mul, width_mul, max_channels]
  n: [0.50, 0.25, 1024]    # Aether-n: ~2.2M params, ultra-fast edge
  s: [0.50, 0.50, 1024]    # Aether-s: ~6.5M params, balanced
  m: [0.50, 1.00, 512]     # Aether-m: ~15M params, standard
  l: [1.00, 1.00, 512]     # Aether-l: ~24M params, high-accuracy
  x: [1.00, 1.50, 512]     # Aether-x: ~45M params, maximum accuracy

backbone:
  # [from, repeats, module, args]

  # ── Stage 0: Stem ──
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2   Standard stem Conv 3×3 stride 2

  # ── Stage 1: P1 → P2 ──
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4   Downsample
  - [-1, 2, C3k2_Aether, [128, False]]           # 2-P2/4   Aether blocks ×2 (OSM-Conv)

  # ── Stage 2: P2 → P3 (small objects) ──
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8   Downsample
  - [-1, 2, C3k2_Aether, [256, False]]           # 4-P3/8   Aether blocks ×2 (Backbone P3)

  # ── Stage 3: P3 → P4 (medium objects) ──
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16  Downsample
  - [-1, 2, C3k2_Aether, [512, False]]           # 6-P4/16  Aether blocks ×2 (Backbone P4)

  # ── Stage 4: P4 → P5 (large objects) ──
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32  Downsample
  - [-1, 2, C3k2_Aether, [1024, True]]           # 8-P5/32  Aether blocks ×2 (Backbone P5)
  - [-1, 1, SPPF, [1024, 5]]                     # 9-P5/32  Spatial Pyramid Pooling (Backbone P5 + SPPF)

head:
  # ════════════════════════ Harmonic Resonant Core ════════════════════════
  # Single-step Multi-scale Resonant interaction (fuses P3, P4, P5 into P4 space)
  - [[4, 6, 9], 1, AetherResonantCore, [512]]    # 10 Central Resonant Core (40×40)

  # ════════════════════════ Scale P3: Broadcast & Adaptive Fusion ════════════════════════
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]   # 11 Broadcast to P3 size (80×80)
  - [[4, 11], 1, AetherCSAF, [256]]              # 12 In-place Content-Spatial Adaptive Fusion with Backbone P3
  - [-1, 2, AetherCSP, [256, False]]             # 13 P3 Output Refinement (80×80)

  # ════════════════════════ Scale P4: Broadcast & Adaptive Fusion ════════════════════════
  - [[6, 10], 1, AetherCSAF, [512]]              # 14 In-place Content-Spatial Adaptive Fusion with Backbone P4
  - [-1, 2, AetherCSP, [512, False]]             # 15 P4 Output Refinement (40×40)

  # ════════════════════════ Scale P5: Broadcast & Adaptive Fusion ════════════════════════
  - [10, 1, Conv, [512, 3, 2]]                   # 16 Broadcast to P5 size (20×20)
  - [[9, 16], 1, AetherCSAF, [1024]]             # 17 In-place Content-Spatial Adaptive Fusion with Backbone P5
  - [-1, 2, AetherCSP, [1024, True]]             # 18 P5 Output Refinement (20×20)

  # ════════════════════════ Detection Head ════════════════════════
  - [[13, 15, 18], 1, Detect, [nc]]              # 19 Detect(P3, P4, P5)
