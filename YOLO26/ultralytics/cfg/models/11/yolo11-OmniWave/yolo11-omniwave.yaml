# OmniWave-YOLO (OW-YOLO): Disentangled Wavelet State-Space & Asymmetric Manifold
# ═══════════════════════════════════════════════════════════════════════════
#
# Core Theoretical Innovations for Q1 Publication:
#   1. Continuous 2D Wavelet State-Space Core (WaveletSSMCore in C3k2_OmniWave):
#      - Disentangles spatial representations into Low-Frequency and High-Frequency subbands.
#      - LinearSSMCore guarantees infinite global receptive field with O(N) complexity.
#      - HighFreqEdgeGate amplifies critical object boundaries and small targets.
#   2. Structural Re-parameterizable Convolution (RepOWConv):
#      - Multi-branch training dynamics fold into single 3x3 Conv at deployment.
#   3. Asymmetric Manifold Decoupled Head (AMDetect):
#      - Classification semantics condition bounding box regression via dynamic low-rank manifold.
#      - Eliminates Task Misalignment while reducing Head parameters by >40%.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # OmniWave-n: ultra-light, ultra-fast edge
  s: [0.50, 0.50, 1024] # OmniWave-s: balanced high-accuracy
  m: [0.50, 1.00, 512]  # OmniWave-m: standard SOTA
  l: [1.00, 1.00, 512]  # OmniWave-l: large scale
  x: [1.00, 1.50, 512]  # OmniWave-x: maximum performance

# OmniWave Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                  # 1-P2/4
  - [-1, 2, C3k2_OmniWave, [256, False, 0.25]]  # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8
  - [-1, 2, C3k2_OmniWave, [512, False, 0.25]]  # 4-P3/8 (Backbone P3)
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16
  - [-1, 2, C3k2_OmniWave, [512, True]]         # 6-P4/16 (Backbone P4)
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32
  - [-1, 2, C3k2_OmniWave, [1024, True]]        # 8-P5/32 (Backbone P5)
  - [-1, 1, SPPF, [1024, 5]]                    # 9-P5/32 (SPPF feature enhancement)

# OmniWave Head (Feature Pyramid & Asymmetric Manifold Detect)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10 (P5 -> P4 scale, 40x40)
  - [[-1, 6], 1, Concat, [1]]                   # 11 Cat backbone P4
  - [-1, 2, C3k2_OmniWave, [512, False]]        # 12 (Neck P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13 (P4 -> P3 scale, 80x80)
  - [[-1, 4], 1, Concat, [1]]                   # 14 Cat backbone P3
  - [-1, 2, C3k2_OmniWave, [256, True]]         # 15 (P3/8-small, with full WaveletSSMCore & RepOWConv!)

  - [-1, 1, Conv, [256, 3, 2]]                  # 16 Downsample P3 -> P4
  - [[-1, 12], 1, Concat, [1]]                  # 17 Cat neck P4
  - [-1, 2, C3k2_OmniWave, [512, False]]        # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 19 Downsample P4 -> P5
  - [[-1, 9], 1, Concat, [1]]                   # 20 Cat neck P5
  - [-1, 2, C3k2_OmniWave, [1024, True]]        # 21 (P5/32-large)

  - [[15, 18, 21], 1, AMDetect, [nc]]           # 22 AMDetect(P3, P4, P5)
