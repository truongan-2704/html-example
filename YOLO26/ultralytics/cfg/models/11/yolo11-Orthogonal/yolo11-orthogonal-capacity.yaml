# YOLO11-Orthogonal-Capacity: full spatial operators with wider CSP refinement.
# Layer format: [from, repeats, module, args]

nc: 80
end2end: true
scale: n

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0: P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1: P2/4
  - [-1, 1, C3k2, [256, false, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3: P3/8
  - [-1, 1, C3k2_Ortho, [512, false, 0.25]]   # 4: P3 backbone
  - [-1, 1, Conv, [512, 3, 2]]                # 5: P4/16
  - [-1, 1, C3k2_Ortho, [512, true]]          # 6: P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]]               # 7: P5/32
  - [-1, 1, C3k2_Ortho, [1024, false, 0.375]] # 8: wider P5 refinement
  - [-1, 1, SPPF, [1024, 5]]                  # 9
  - [-1, 1, SimAM, []]                        # 10

head:
  # Top-down feature fusion
  - [[6, 10], 1, OSIFusion, [512]]            # 11: P4 fusion
  - [-1, 1, C3k2_Ortho, [512, false, 0.375]]  # 12: wider P4 refinement
  - [[4, 12], 1, OSIFusion, [256]]            # 13: P3 fusion
  - [-1, 1, C3k2_Ortho, [256, false, 0.50]]   # 14: wider P3 output

  # Bottom-up feature fusion
  - [-1, 1, Conv, [256, 3, 2]]                # 15: P3 -> P4
  - [[12, 15], 1, OSIFusion, [512]]           # 16: P4 fusion
  - [-1, 1, C3k2_Ortho, [512, false, 0.375]]  # 17: wider P4 output
  - [-1, 1, Conv, [512, 3, 2]]                # 18: P4 -> P5
  - [[10, 18], 1, OSIFusion, [1024]]          # 19: P5 fusion
  - [-1, 1, C3k2_Ortho, [1024, false, 0.25]]  # 20: P5 output

  # Detection on P3, P4 and P5
  - [[14, 17, 20], 1, Detect, [nc]]           # 21
