# ═══════════════════════════════════════════════════════════════════════════
# YOLO-Orthogonal: Dynamic Gated Cross-Fusion & Orthogonal Self-Attention
# ═══════════════════════════════════════════════════════════════════════════
#
# Ultra-Fast & High-Accuracy Architecture (~2.4M Params, ~5.6 GFLOPs):
#   1. ODR-Conv (Orthogonal Directional Reparameterization):
#      - Multi-branch canonical decomposition (3×3, 1×3, 3×1, 1×1, Identity).
#      - 100% learnable via gradient backpropagation.
#      - Collapses into a single 3×3 Conv kernel upon model.fuse().
#
#   2. DOC-Neck (Dynamic Orthogonal Cross-Fusion Neck):
#      - Resolves multi-scale feature collision via adaptive channel gating:
#        Y = P_loc * (1 + Gate(P_glb)) + Proj(P_glb).
#      - Preserves 100% fine spatial details without parameter bloat.
#
#   3. C2PSA_Ortho Global Context at P5:
#      - Multi-head area self-attention captures long-range inter-cell context across slides.
#      - Fully fusible with zero deployment latency.
#
#   4. End-to-End NMS-Free Head:
#      - Direct bounding box prediction with reg_max=1 (postprocess ~0.3ms).

nc: 80
end2end: True # Enable NMS-Free End-to-End dual label assignment (postprocess ~0.3ms)
reg_max: 1    # Direct box coordinate regression (cuts 500,000 redundant head parameters)
scales:
  # [depth_mul, width_mul, max_channels]
  n: [0.50, 0.25, 1024]    # Orthogonal-n: ~2.4M params (fused), ~5.6 GFLOPs (< 2.2ms)
  s: [0.50, 0.50, 1024]    # Orthogonal-s: ~9.2M params, balanced
  m: [0.50, 1.00, 512]     # Orthogonal-m: ~21M params, standard
  l: [1.00, 1.00, 512]     # Orthogonal-l: ~26M params, high accuracy
  x: [1.00, 1.50, 512]     # Orthogonal-x: ~58M params, maximum accuracy

backbone:
  # [from, repeats, module, args]

  # ── Stage 0: Stem ──
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2 (16 ch)

  # ── Stage 1: P1 → P2 ──
  - [-1, 1, Conv, [128, 3, 2]]                  # 1-P2/4 (32 ch)
  - [-1, 2, C3k2, [256, False, 0.25]]           # 2-P2/4 (64 ch)

  # ── Stage 2: P2 → P3 (small objects & platelets) ──
  - [-1, 1, Conv, [256, 3, 2]]                  # 3-P3/8 (64 ch)
  - [-1, 2, C3k2_Ortho, [512, False, 0.25]]     # 4-P3/8 (Backbone P3, 128 ch)

  # ── Stage 3: P3 → P4 (medium objects & leukocytes) ──
  - [-1, 1, Conv, [512, 3, 2]]                  # 5-P4/16 (128 ch)
  - [-1, 2, C3k2_Ortho, [512, True]]            # 6-P4/16 (Backbone P4, 128 ch, c3k=True OrthoC3k)

  # ── Stage 4: P4 → P5 (large objects & global semantics) ──
  - [-1, 1, Conv, [1024, 3, 2]]                 # 7-P5/32 (256 ch)
  - [-1, 2, C3k2_Ortho, [1024, True, 0.25]]     # 8-P5/32 (Backbone P5, 256 ch, c3k=True OrthoC3k)
  - [-1, 1, SPPF, [1024, 5]]                    # 9-P5/32 (Backbone P5, 256 ch)
  - [-1, 1, C2PSA_Ortho, [1024]]                # 10-P5/32 (Multi-Head Polarized Self-Attention)

head:
  # ════════════════════════ Top-Down Semantic Wave ════════════════════════
  # Wave 1: Dynamic Orthogonal Cross-Fusion of P4 (from 6, 128ch) and P5 (from 10, 256ch)
  - [[6, 10], 1, DOC_Fusion, [512]]             # 11 P4_td_fused (128 ch @ 40x40)
  - [-1, 1, C3k2_Ortho, [512, False, 0.5]]      # 12 P4_td_refined (128 ch @ 40x40)

  # Wave 2: Dynamic Orthogonal Cross-Fusion of P3 (from 4, 128ch) and P4 (from 12, 128ch)
  - [[4, 12], 1, DOC_Fusion, [256]]             # 13 P3_out_fused (64 ch @ 80x80)
  - [-1, 1, C3k2_Ortho, [256, False, 0.5]]      # 14 P3_out_refined (64 ch @ 80x80, small objects & platelets)

  # ════════════════════════ Bottom-Up Detail Wave ════════════════════════
  # Detail Wave 1: Send fine boundary details from P3 UP into P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 15 P3 -> P4 downsample (64 ch @ 40x40)
  - [[12, 15], 1, DOC_Fusion, [512]]            # 16 P4_bu_fused (128 ch @ 40x40)
  - [-1, 1, C3k2_Ortho, [512, False, 0.5]]      # 17 P4_out_refined (128 ch @ 40x40, medium objects)

  # Detail Wave 2: Send enriched details from P4 UP into P5
  - [-1, 1, Conv, [512, 3, 2]]                  # 18 P4 -> P5 downsample (128 ch @ 20x20)
  - [[10, 18], 1, DOC_Fusion, [1024]]           # 19 P5_bu_fused (256 ch @ 20x20)
  - [-1, 1, C3k2_Ortho, [1024, True, 0.25]]     # 20 P5_out_refined (256 ch @ 20x20, large objects)

  # ════════════════════════ Detection Head ════════════════════════
  - [[14, 17, 20], 1, Detect, [nc]]             # 21 Detect(P3, P4, P5)
