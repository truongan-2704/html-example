# Ultralytics YOLO 🚀, AGPL-3.0
# YOLO12 HYBRID PLUS: C2PSA + 1 CA Backbone + Full CA Head + BiFPN + P2 Loop

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# =============================================================================
# BACKBONE (Modified: SPPF -> C2PSA -> CoordAtt)
# =============================================================================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]             # 0
  - [-1, 1, Conv, [128, 3, 2]]            # 1
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2 - P2/4
  - [-1, 1, Conv, [256, 3, 2]]            # 3
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 - P3/8
  - [-1, 1, Conv, [512, 3, 2]]            # 5
  - [-1, 2, C3k2, [512, True]]            # 6 - P4/16
  - [-1, 1, Conv, [1024, 3, 2]]           # 7
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9

  # ✅ BỔ SUNG C2PSA (Layer 10)
  - [-1, 1, C2PSA, [1024]]                # 10

  # 🔥 CA CHỐT HẠ (Layer 11)
  - [-1, 1, CoordAtt, []]                 # 11 (Output Backbone mới)

# =============================================================================
# HEAD (Index Shifted +1 due to C2PSA insertion)
# =============================================================================
head:
  # === Top-down Path ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, BiFPN, [256]]                   # 13 (Nối P4 Backbone)
  - [-1, 2, C3k2, [256, False]]                  # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, BiFPN, [256]]                   # 16 (Nối P3 Backbone)
  - [-1, 2, C3k2, [256, False]]                  # 17
  - [-1, 1, CoordAtt, []]                        # 18 (Index cũ 17 -> 18)

  # === P2 Loop (High Res) ===
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19
  - [[-1, 2], 1, BiFPN, [256]]                   # 20 (Nối P2 Backbone)
  - [-1, 3, C3k2, [128, False]]                  # 21
  - [-1, 1, CoordAtt, []]                        # 22 (Index cũ 21 -> 22)

  # === Bottom-up Path ===

  # --- P3 Output ---
  - [-1, 1, Conv, [256, 3, 2]]                   # 23
  # Input BiFPN: [-1, 4, 18] (18 là CA Top-down P3 mới)
  - [[-1, 4, 18], 1, BiFPN, [256]]               # 24
  - [-1, 4, C3k2, [256, False]]                  # 25
  - [-1, 1, CoordAtt, []]                        # 26 -> Detect P3 (Index cũ 25 -> 26)

  # --- P4 Output ---
  - [-1, 1, Conv, [256, 3, 2]]                   # 27
  # Input BiFPN: [-1, 6, 14] (14 là Top-down P4 mới)
  - [[-1, 6, 14], 1, BiFPN, [256]]               # 28
  - [-1, 4, C3k2, [512, False]]                  # 29
  - [-1, 1, CoordAtt, []]                        # 30 -> Detect P4 (Index cũ 29 -> 30)

  # --- P5 Output ---
  - [-1, 1, Conv, [256, 3, 2]]                   # 31
  # 🔥 Input BiFPN: [-1, 11] (Nối vào Layer 11 - CA Backbone cuối cùng)
  - [[-1, 11], 1, BiFPN, [512]]                  # 32
  - [-1, 2, C3k2, [1024, True]]                  # 33
  - [-1, 1, CoordAtt, []]                        # 34 -> Detect P5 (Index cũ 33 -> 34)

  # Detect
  # Update input: [26, 30, 34]
  - [[26, 30, 34], 1, Detect, [nc]]